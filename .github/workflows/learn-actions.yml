name: Learn GitHub Actions (CI & Playground)

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the GitHub Actions tab!
  workflow_dispatch:
    inputs:
      greeting_name:
        description: "Name to say hello to"
        required: false
        default: "Sanjay"

jobs:
  # Job 1: Playground & Learning
  explore-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: |
          echo "Hello ${{ github.event.inputs.greeting_name || 'Developer' }}!"
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Check Runner Specs
        run: |
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          echo "Available Memory:"
          free -h

  # Job 2: Real-World CI (Lint & Build Test)
  verify-project:
    runs-on: ubuntu-latest
    needs: explore-environment  # Runs after Job 1 succeeds
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm install

      - name: 4. Check for code issues (Lint)
        run: npm run lint

      - name: 5. Test Build (Compile check)
        run: npm run build
